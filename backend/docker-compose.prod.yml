# PRODUCTION (VPS). Only Caddy publishes ports (80/443). The API and database are internal.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_DOMAIN=${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://fyntra:${POSTGRES_PASSWORD}@db:5432/fyntra
      STORAGE_DIR: /data/filings
    volumes:
      - filings:/data/filings
      - ./config:/app/config:ro
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fyntra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fyntra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fyntra -d fyntra"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  filings:
  caddy_data:
  caddy_config:
